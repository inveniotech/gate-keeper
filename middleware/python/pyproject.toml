[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "inveniotech-gate-keeper"
version = "0.1.0"
description = "Gate-Keeper native Python middleware"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "InvenioTech"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/inveniotech/gate-keeper"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"inveniotech.gatekeeper" = ["py.typed", "embedded/*.json"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
