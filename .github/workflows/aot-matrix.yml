name: AOT matrix (spike)

# NativeAOT feasibility spike (P0-16), question 5: prove the runtime-identifier
# matrix builds on GitHub-hosted runners and record the size per identifier.
# This workflow is throwaway and is deleted together with spikes/aot/ after
# Phase 1.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spikes/aot/**"
      - "Directory.Packages.props"

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            musl: false
          - rid: win-arm64
            os: windows-11-arm
            musl: false
          - rid: linux-x64
            os: ubuntu-latest
            musl: false
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            musl: false
          # The musl variants build inside an Alpine container, because NativeAOT
          # does not cross-compile between C libraries in practice (IQ-59). The
          # build runs through `docker run` rather than the job's `container:`
          # directive, because GitHub Actions does not run JavaScript actions
          # (checkout, setup-dotnet) inside Alpine containers on arm64 runners.
          - rid: linux-musl-x64
            os: ubuntu-latest
            musl: true
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            musl: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        if: matrix.musl == false
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Publish with NativeAOT (glibc and Windows)
        if: matrix.musl == false
        run: dotnet publish spikes/aot/EverythingSpike/EverythingSpike.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Publish with NativeAOT (musl, inside Alpine)
        if: matrix.musl == true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk add --no-cache clang build-base zlib-static && dotnet publish spikes/aot/EverythingSpike/EverythingSpike.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true"

      - name: Report binary size (Linux)
        if: runner.os == 'Linux'
        run: |
          binary=$(find spikes/aot/EverythingSpike/bin/Release -type f -name EverythingSpike -o -type f -name EverythingSpike.exe | head -n 1)
          size=$(stat -c %s "$binary")
          echo "RID=${{ matrix.rid }} SIZE=$size"

      - name: Report binary size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Recurse -File spikes/aot/EverythingSpike/bin/Release -Filter EverythingSpike.exe | Select-Object -First 1
          Write-Output "RID=${{ matrix.rid }} SIZE=$($binary.Length)"
