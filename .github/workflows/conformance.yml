name: Cross-stack conformance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - name: Verify engine-generated vectors and pack digests
        run: |
          dotnet restore --locked-mode
          dotnet test tests/Corpus.Tests -c Release --no-restore --filter FullyQualifiedName~ConformanceExportTests
      - name: Verify Node regex candidates
        run: node tests/conformance/check-patterns.mjs
      - name: Verify JVM regex candidates
        run: java tests/conformance/CheckPatterns.java tests/conformance/patterns.tsv
