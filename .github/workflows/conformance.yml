name: Cross-stack conformance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Verify engine-generated vectors and pack digests
        run: |
          pwsh -NoProfile -File tests/conformance/Sync-RuntimeVersion.ps1 -Check
          dotnet restore --locked-mode
          dotnet test tests/Corpus.Tests -c Release --no-restore --filter FullyQualifiedName~ConformanceExportTests
          dotnet test tests/Engine.Tests -c Release --no-restore --filter 'FullyQualifiedName~RuntimeMatcherTests|FullyQualifiedName~ConsentCheckTests|FullyQualifiedName~ResponseFilterTests'
      - name: Publish and execute the real middleware core with NativeAOT
        run: |
          dotnet publish tests/conformance/NativeProbe -c Release -r linux-x64 -p:PublishAot=true -p:PublishTrimmed=true -p:ILLinkTreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true -p:NuGetLockFilePath=obj/packages.native.lock.json -o artifacts/middleware-native
          artifacts/middleware-native/MiddlewareNativeProbe
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify regex candidates
        run: node tests/conformance/check-patterns.mjs
      - name: Verify native matcher, validators, redaction, consent and wildcard responses
        run: node tests/conformance/check-runtime.mjs
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
      - name: Verify regex candidates
        run: java tests/conformance/CheckPatterns.java tests/conformance/patterns.tsv
      - name: Compile the native core as Java 15 bytecode
        run: |
          mkdir -p artifacts/conformance-jvm
          javac --release 15 -d artifacts/conformance-jvm middleware/jvm/src/africa/gatekeeper/*.java tests/conformance/VectorJson.java tests/conformance/ResponseFailureProbe.java tests/conformance/CheckRuntime.java tests/conformance/CheckPackLoad.java middleware/jvm/sample/CoreExample.java
      - name: Verify native matcher, validators, redaction, consent and wildcard responses
        run: java -cp artifacts/conformance-jvm CheckRuntime
      - name: Verify signed loading, installation and RFC 8032 vectors
        run: java -cp artifacts/conformance-jvm CheckPackLoad
  jvm-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
      - name: Select the adapter test runtime
        run: echo "GATEKEEPER_TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build hooks, exercise bounded responses and compile Java samples
        run: gradle -p middleware/jvm --no-daemon build verifyAdapters
