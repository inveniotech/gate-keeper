name: Measurement report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      evaluation_date:
        description: 'Optional UTC evaluation date in the yyyy-MM-dd form; defaults to the run date.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  false-positive-report:
    name: Weekly false-positive measurement
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Fix the evaluation date from the run metadata
        id: date
        shell: pwsh
        env:
          REQUESTED_DATE: ${{ inputs.evaluation_date }}
        run: |
          $requested = $env:REQUESTED_DATE
          $date = if ($requested) { $requested } else { (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture) }
          Add-Content $env:GITHUB_OUTPUT "evaluation-date=$date"

      - name: Run the harness and write the dated report
        shell: pwsh
        run: ./ci/rule-packs/Measure-Detection.ps1 -EvaluationDate '${{ steps.date.outputs.evaluation-date }}' -MeasurementRevision ${{ github.sha }}

      - name: Upload the dated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-positive-report-${{ steps.date.outputs.evaluation-date }}
          path: docs/reports/false-positive-*.md
          if-no-files-found: error

      - name: Publish the report as the job summary
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem docs/reports/false-positive-*.md | Sort-Object Name | Select-Object -Last 1
          if ($report) { Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content $report.FullName -Raw) }
