name: Synthetic privacy inventory
on:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Fail if the documented generator and privacy inventory differ
        run: node --test ci/privacy/inventory.test.mjs
